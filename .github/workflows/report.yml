name: ADR change report
on:
  schedule:
    - cron: "0 7 * * 1"      # Mondays 07:00 UTC — weekly
    - cron: "0 7 1,15 * *"   # 1st and 15th — fortnightly snapshot
    - cron: "0 7 1 1,4,7,10 *"   # quarter start — quarterly governance report
  workflow_dispatch:
    inputs:
      days: { description: "Window in days (7 or 14)", default: "7" }
permissions: { contents: write }
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then
            case "${{ github.event.schedule }}" in
              "0 7 1 1,4,7,10 *") DAYS=90;;
              "0 7 1,15 * *") DAYS=14;;
              *) DAYS=7;;
            esac
          fi
          node scripts/report.mjs --days "$DAYS"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ADR change report"
          file_pattern: "reports/*.md docs/data/reports.json"
